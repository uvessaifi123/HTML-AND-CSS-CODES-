
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="project.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Destry Website</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header-overlay">

            <img src="https://htmldemo.net/destry/destry/assets/images/logo/logo.png"
                 alt="Destry Logo" class="logo">

            <nav>
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">Pages</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>
            </nav>

            <ul class="nav-cart">
                <li><a href="#"><i class="fa fa-search"></i></a></li>
                <li><a href="#"><i class="fa fa-user"></i></a></li>
                <li><a href="#"><i class="fa fa-heart-o"></i></a></li>
                <li><a href="#"><i class="fa fa-shopping-cart"></i></a></li>
            </ul>

            <div class="bar">
                <i class="fa fa-bars"></i>
            </div>

        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay">
            <h1>Women New Collection</h1>
            <p>Up to 70% off selected items</p>
            <button class="btn-primary">Shop Now</button>
        </div>
    </section>

    <!-- Category Images -->
    <section class="gridTable">

        <div class="b1">
            <img src="https://dreaming-theme.netlify.app/akasha/assets/images/banner11.jpg"
                 alt="Hoodie">
        </div>

        <div class="b2">
            <img src="https://dreaming-theme.netlify.app/akasha/assets/images/banner12.jpg"
                 alt="Glasses">
        </div>

        <div class="b4">
            <img src="https://dreaming-theme.netlify.app/akasha/assets/images/banner13.jpg"
                 alt="Beanie">
        </div>

    </section>

</body>
</html>
